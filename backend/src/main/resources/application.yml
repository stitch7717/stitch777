server:
  port: 8080

spring:
  profiles:
    # 本地开发默认加载 application-local.yml（已 gitignore）；部署时用环境变量覆盖
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: medical-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/medical?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # 至少 32 字节；本地开发放 application-local.yml，部署时通过 JWT_SECRET 注入
    secret: ${JWT_SECRET:}
    # 会话超时（分钟），对应安全配置 security.session-timeout
    expire-minutes: 120
  crypto:
    # AES-256-GCM 密钥（Base64 编码的 32 字节），本地开发放 application-local.yml
    aes-key: ${AES_KEY:}
    # 身份证检索列 HMAC 密钥（至少 16 字节）
    id-card-pepper: ${ID_CARD_PEPPER:}

logging:
  level:
    com.medical: debug
